name: Build AETHER Android

on:
  push:
    branches:
      - aether-android-showcase
    paths:
      - 'aether-native/src/**'
      - 'aether-native/res/**'
      - 'aether-native/AndroidManifest.xml'
      - '.github/workflows/aether-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: aether-android-showcase

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile Android framework app
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf out
          mkdir -p out/classes out/dex
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          BT="$ANDROID_HOME/build-tools/35.0.0"

          javac -source 8 -target 8 -encoding UTF-8             -classpath "$ANDROID_JAR"             -d out/classes             src/com/aether/noema/MainActivity.java

          mapfile -t CLASS_FILES < <(find out/classes -name '*.class' -print)
          "$BT/d8"             --lib "$ANDROID_JAR"             --min-api 26             --output out/dex             "${CLASS_FILES[@]}"

          "$BT/aapt2" compile             --dir res             -o out/resources.zip

          "$BT/aapt2" link             -o out/AETHER-unsigned.apk             -I "$ANDROID_JAR"             --manifest AndroidManifest.xml             -R out/resources.zip             --min-sdk-version 26             --target-sdk-version 35             --version-code 2             --version-name 0.2.0

          zip -j out/AETHER-unsigned.apk out/dex/classes.dex
          "$BT/zipalign" -f -p 4 out/AETHER-unsigned.apk out/AETHER-aligned.apk

          keytool -genkeypair             -keystore out/debug.keystore             -storepass android             -keypass android             -alias aether             -dname "CN=AETHER,O=NOEMA Prototype,C=SG"             -keyalg RSA             -keysize 2048             -validity 10000

          "$BT/apksigner" sign             --ks out/debug.keystore             --ks-key-alias aether             --ks-pass pass:android             --key-pass pass:android             --out out/AETHER-debug.apk             out/AETHER-aligned.apk

          "$BT/apksigner" verify --verbose out/AETHER-debug.apk
          "$BT/aapt2" dump badging out/AETHER-debug.apk | head -40

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-android-apk
          path: aether-native/out/AETHER-debug.apk
          if-no-files-found: error

      - name: Publish APK back to branch
        shell: bash
        working-directory: .
        run: |
          set -euxo pipefail
          mkdir -p aether-native/releases
          cp aether-native/out/AETHER-debug.apk aether-native/releases/AETHER-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aether-native/releases/AETHER-debug.apk
          git commit -m "AETHER v0.2: publish installable APK [skip ci]" || exit 0
          git push origin HEAD:aether-android-showcase
