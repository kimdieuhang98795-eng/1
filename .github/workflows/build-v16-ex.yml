name: Build Reva Android v1.6 Chinese EX APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v16-ex.yml'
      - 'v1.2/**'
      - 'v1.3/**'
      - 'v1.4/**'
      - 'v1.5/**'
      - 'v1.6/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout source bootstrap and transforms
        uses: actions/checkout@v4

      - name: Reassemble baseline and apply v1.2 through v1.5 input core
        run: |
          set -euo pipefail
          cat archive/part00 archive/part01 archive/part02 archive/part03 archive/part04 archive/part05 archive/part06 archive/part07 archive/part08 > /tmp/reva.zip.b64
          test "$(wc -c < /tmp/reva.zip.b64)" -eq 86132
          base64 -d /tmp/reva.zip.b64 > /tmp/reva_v1_1.zip
          echo '6ea5b7f9cd0d5a83e925de9199a17d4d8a969dad471e054ca681a9456747a3d2  /tmp/reva_v1_1.zip' | sha256sum -c -
          rm -rf work && mkdir -p work
          unzip -q /tmp/reva_v1_1.zip -d work
          cd work/reva_android_wrapper_v1_1
          cat "$GITHUB_WORKSPACE"/v1.2/mainpatch.part* > /tmp/v12-main.patch
          patch -p0 --fuzz=0 < /tmp/v12-main.patch
          python3 "$GITHUB_WORKSPACE/v1.3/apply_v13.py" app/src/main/java/com/ajiu/reva/MainActivity.java
          python3 "$GITHUB_WORKSPACE/v1.4/run_apply_v14_fixed.py" app/src/main/java/com/ajiu/reva/MainActivity.java
          python3 "$GITHUB_WORKSPACE/v1.4/finalize_v14.py" app/src/main/java/com/ajiu/reva/MainActivity.java
          python3 "$GITHUB_WORKSPACE/v1.5/apply_v15.py" app/src/main/java/com/ajiu/reva/MainActivity.java
          python3 "$GITHUB_WORKSPACE/v1.5/run_finalize_v15_fixed.py" app/src/main/java/com/ajiu/reva/MainActivity.java
          python3 "$GITHUB_WORKSPACE/v1.5/strengthen_v15.py" app/src/main/java/com/ajiu/reva/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text().replace('versionCode 11','versionCode 16').replace("versionName '1.1'","versionName '1.6'")
          p.write_text(s)

          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          s=s.replace('优先使用 APK 内置 Ruffle；只有构建时未打包 Ruffle 才会尝试联网备用源。','Ruffle 与 3.0 EX 汉化本体均随 APK 内置；正常启动完全离线。')
          s=s.replace('Ruffle 与 Final 本体均随 APK 内置；正常启动完全离线，联网仅用于可选修复 / 更换本体。','Ruffle 与 3.0 EX 汉化本体均随 APK 内置；正常启动完全离线。')
          s=s.replace('从左上角菜单选择“智能获取本体”或“导入 / 替换原版 SWF”。','左上角菜单保留手动导入/修复功能；正常游玩无需下载其他本体。')
          s=s.replace('window.__REVA_PLAYER_READY__=true;','window.__REVA_PLAYER_READY__=true; console.log(\'REVA_GAME_READY\');')
          p.write_text(s)

          p=Path('app/src/main/java/com/ajiu/reva/MainActivity.java')
          s=p.read_text()
          s=s.replace('修复 / 更换本体（联网：4399 → Final 保存源 → 官方包）','修复 / 更换本体（会切换为其他兼容本体）')
          s=s.replace('APK 已内置离线 game.swf','APK 已内置 3.0 EX 汉化 game.swf')
          p.write_text(s)
          PY
          cp "$GITHUB_WORKSPACE/v1.3/qa_nav.html" app/src/main/assets/qa_nav.html
          cp "$GITHUB_WORKSPACE/v1.5/qa_input.html" app/src/main/assets/qa_input.html
          cp "$GITHUB_WORKSPACE/v1.5/check_project.py" tools/check_project.py
          cp "$GITHUB_WORKSPACE/v1.5/emulator_smoke.sh" tools/emulator_smoke.sh
          python3 "$GITHUB_WORKSPACE/v1.5/fix_emulator_smoke.py" tools/emulator_smoke.sh
          python3 "$GITHUB_WORKSPACE/v1.6/fix_ex_smoke.py" tools/emulator_smoke.sh
          # Adapt the inherited checker to the new wrapper version instead of suppressing it.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/check_project.py')
          s=p.read_text().replace('versionCode 15','versionCode 16').replace("versionName '1.5'","versionName '1.6'")
          p.write_text(s)
          PY
          chmod +x tools/check_project.py tools/emulator_smoke.sh
          cd ..
          mv reva_android_wrapper_v1_1 reva_android_wrapper_v1_6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bundle pinned Ruffle self-hosted
        working-directory: work/reva_android_wrapper_v1_6
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/ruffle /tmp/ruffle_pkg
          curl -fL --retry 3 --retry-delay 2 -o /tmp/ruffle.zip "https://github.com/ruffle-rs/ruffle/releases/download/nightly-2026-09-05/ruffle-nightly-2026_09_05-web-selfhosted.zip"
          unzip -q /tmp/ruffle.zip -d /tmp/ruffle_pkg
          cp -a /tmp/ruffle_pkg/. app/src/main/assets/ruffle/
          test -f app/src/main/assets/ruffle/ruffle.js
          find app/src/main/assets/ruffle -maxdepth 1 -name '*.wasm' -print -quit | grep .

      - name: Bundle pinned 3.0 EX Chinese SWF
        working-directory: work/reva_android_wrapper_v1_6
        run: |
          set -euo pipefail
          rm -f app/src/main/assets/game.swf app/src/main/assets/game.swf.part
          python3 - <<'PY'
          import urllib.request, pathlib, hashlib, zlib, re
          url='https://www.mhhf.com/files/game/4711/lbmxex.swf'
          expected_size=17628685
          expected_sha='0c7904469438078919c705dc7d0da11a9e0595fce29decd68f84599b25d3f457'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.mhhf.com/game/play/4711?format=11'})
          b=urllib.request.urlopen(req,timeout=120).read()
          assert len(b)==expected_size,(len(b),expected_size)
          assert b[:3]==b'CWS',b[:3]
          assert int.from_bytes(b[4:8],'little')==28435282
          sha=hashlib.sha256(b).hexdigest()
          assert sha==expected_sha,(sha,expected_sha)
          raw=b'FWS'+b[3:8]+zlib.decompress(b[8:])
          text=raw.decode('utf-8','ignore')
          cjk=len(re.findall(r'[\u4e00-\u9fff]',text))
          assert cjk>1000,cjk
          assert '雷巴' in text and '晓之车' in text
          pathlib.Path('app/src/main/assets/game.swf').write_bytes(b)
          pathlib.Path('bundled-game.txt').write_text(
              f'SOURCE={url}\nEDITION=3.0 EX 汉化版\nSIZE={len(b)}\nDECLARED=28435282\nSHA256={sha}\nCJK_COUNT={cjk}\n')
          print(pathlib.Path('bundled-game.txt').read_text())
          PY
          python3 tools/verify_swf.py app/src/main/assets/game.swf

      - name: Run full adapted local QA
        working-directory: work/reva_android_wrapper_v1_6
        run: |
          set -euo pipefail
          bash qa/run_local_qa.sh
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app/build.gradle').read_text()
          main=Path('app/src/main/java/com/ajiu/reva/MainActivity.java').read_text()
          html=Path('app/src/main/assets/index.html').read_text()
          assert "versionCode 16" in app and "versionName '1.6'" in app
          for token in ['ROLE_JOYSTICK','ROLE_BUTTON','ROLE_GAME','logical','REVA_TRACE']:
              assert token in main, token
          assert 'recoverJoystickOnMove' not in main
          assert '3.0 EX' in html or '3.0 EX' in main
          print('PASS v1.6 structure: full inherited QA + v1.5 input core + EX labeling')
          PY

      - name: Build debug APK
        working-directory: work/reva_android_wrapper_v1_6
        run: gradle --no-daemon assembleDebug

      - name: Inspect APK contents and metadata
        working-directory: work/reva_android_wrapper_v1_6
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee app-debug.apk.sha256
          unzip -l "$APK" | tee apk-files.txt
          grep -E 'assets/game.swf|assets/ruffle/ruffle.js|assets/ruffle/.*\.wasm|assets/qa_input.html|assets/qa_nav.html' apk-files.txt
          awk '$4=="assets/game.swf" { if ($1 != 17628685) exit 1; found=1 } END { if (!found) exit 1 }' apk-files.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.ajiu.reva'" apk-badging.txt
          grep -q "versionName='1.6'" apk-badging.txt
          grep -q "targetSdkVersion:'35'" apk-badging.txt

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android 35 emulator EX + DOM-input regression
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            bash work/reva_android_wrapper_v1_6/tools/emulator_smoke.sh work/reva_android_wrapper_v1_6/app/build/outputs/apk/debug/app-debug.apk work/reva_android_wrapper_v1_6/qa/emulator

      - name: Upload v1.6 APK and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reva-android-v1.6-chinese-ex
          if-no-files-found: warn
          path: |
            work/reva_android_wrapper_v1_6/app/build/outputs/apk/debug/app-debug.apk
            work/reva_android_wrapper_v1_6/app-debug.apk.sha256
            work/reva_android_wrapper_v1_6/apk-badging.txt
            work/reva_android_wrapper_v1_6/apk-files.txt
            work/reva_android_wrapper_v1_6/bundled-game.txt
            work/reva_android_wrapper_v1_6/qa/emulator/**
