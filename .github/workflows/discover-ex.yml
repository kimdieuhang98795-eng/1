name: Discover Reva 3.0 EX source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/discover-ex.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Discover, download and fingerprint EX candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ex
          python - <<'PY'
          import re, html, urllib.request, pathlib, hashlib, zlib

          UA={'User-Agent':'Mozilla/5.0'}
          pages={
            'mhhf':'https://www.mhhf.com/game/play/4711?format=11',
            '7k7k':'https://www.7k7k.com/swf/207478.htm',
          }
          htmls={}
          for name,u in pages.items():
            req=urllib.request.Request(u,headers=UA)
            data=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
            htmls[name]=data
            print('PAGE',name,'LEN',len(data))

          m=re.search(r'([/A-Za-z0-9_.:-]+\.swf(?:\?[^\"\'<> ]*)?)',htmls['mhhf'],re.I)
          # Prefer the explicit game/4711 path, not Ruffle/test assets.
          all_m=re.findall(r'[^\"\'<> ]+\.swf(?:\?[^\"\'<> ]*)?',htmls['mhhf'],re.I)
          mhhf_rel=next((x for x in all_m if '/files/game/4711/' in x),None)
          all_7=re.findall(r'https?://[^\"\'<> ]+\.swf(?:\?[^\"\'<> ]*)?',htmls['7k7k'],re.I)
          k7=next((x for x in all_7 if 'flash.7k7k.com' in x),None)
          if not mhhf_rel: raise SystemExit('No MHHF game 4711 SWF found')
          if not k7: raise SystemExit('No 7k7k SWF found')
          candidates={
            'mhhf':'https://www.mhhf.com'+mhhf_rel if mhhf_rel.startswith('/') else mhhf_rel,
            '7k7k':k7,
          }
          print('MHHF_URL',candidates['mhhf'])
          print('7K7K_URL',candidates['7k7k'])

          def fetch(name,url):
            req=urllib.request.Request(url,headers=UA)
            b=urllib.request.urlopen(req,timeout=90).read()
            p=pathlib.Path('/tmp/ex')/(name+'.swf')
            p.write_bytes(b)
            return b

          def inspect(name,b):
            if len(b)<8: raise SystemExit(name+' too small')
            sig=b[:3]
            if sig not in (b'FWS',b'CWS',b'ZWS'):
              raise SystemExit(f'{name} bad SWF sig {sig!r}')
            ver=b[3]
            declared=int.from_bytes(b[4:8],'little')
            sha=hashlib.sha256(b).hexdigest()
            print('SWF',name,'SIG',sig.decode(),'VER',ver,'ACTUAL',len(b),'DECLARED',declared,'SHA256',sha)
            raw=b
            if sig==b'CWS':
              try: raw=b'FWS'+b[3:8]+zlib.decompress(b[8:])
              except Exception as e: print('DECOMPRESS_FAIL',name,repr(e))
            text=raw.decode('utf-8','ignore')
            cjk=re.findall(r'[\u4e00-\u9fff]',text)
            probes=['开始游戏','雷巴','魔剑','角色','难度','商城','无敌','晓之车']
            found=[x for x in probes if x in text]
            print('TEXT',name,'CJK_COUNT',len(cjk),'PROBES',','.join(found) if found else '(none)')
            # Give safe short samples so we can verify this is a Chinese build without dumping game text.
            samples=[]
            for mm in re.finditer(r'[\u4e00-\u9fff]{2,12}',text):
              s=mm.group(0)
              if s not in samples: samples.append(s)
              if len(samples)>=12: break
            print('CJK_SAMPLES',name,' | '.join(samples))
            return {'sig':sig.decode(),'actual':len(b),'declared':declared,'sha':sha,'cjk':len(cjk),'found':found}

          reports={}
          for name,url in candidates.items():
            reports[name]=inspect(name,fetch(name,url))

          expected=44271336
          if reports['mhhf']['actual'] != expected:
            raise SystemExit(f'MHHF size mismatch: {reports["mhhf"]["actual"]} != public page {expected}')
          if reports['mhhf']['cjk'] < 50:
            raise SystemExit('MHHF candidate does not look like a Chinese build')

          out=pathlib.Path('/tmp/ex/report.txt')
          out.write_text('\n'.join([
            'MHHF_URL='+candidates['mhhf'],
            'MHHF_SIZE='+str(reports['mhhf']['actual']),
            'MHHF_SHA256='+reports['mhhf']['sha'],
            'MHHF_CJK_COUNT='+str(reports['mhhf']['cjk']),
            '7K7K_URL='+candidates['7k7k'],
            '7K7K_SIZE='+str(reports['7k7k']['actual']),
            '7K7K_SHA256='+reports['7k7k']['sha'],
            '7K7K_CJK_COUNT='+str(reports['7k7k']['cjk']),
          ])+'\n')
          print(out.read_text())
          PY

      - name: Upload fingerprint report
        uses: actions/upload-artifact@v4
        with:
          name: reva-ex-source-report
          path: /tmp/ex/report.txt
