name: Trace 3.0 EX Skill Symbols And Key Mappings

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/extract-skill-symbols.yml'

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download pinned 3.0 EX and FFDec
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,hashlib
          u='https://www.mhhf.com/files/game/4711/lbmxex.swf'
          q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.mhhf.com/'})
          b=urllib.request.urlopen(q,timeout=120).read()
          assert len(b)==17628685
          assert hashlib.sha256(b).hexdigest()=='0c7904469438078919c705dc7d0da11a9e0595fce29decd68f84599b25d3f457'
          open('/tmp/game.swf','wb').write(b)
          PY
          curl -fL --retry 3 --retry-delay 2 -o /tmp/ffdec.zip 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip'
          echo '0333b56998a55bd83f4e0deb678a811fcdc45607582b4f5dd438309c8c3ad5ce  /tmp/ffdec.zip' | sha256sum -c -
          mkdir -p /tmp/ffdec && unzip -q /tmp/ffdec.zip -d /tmp/ffdec

      - name: Export ActionScript
        run: |
          set -euo pipefail
          mkdir -p /tmp/scripts skill-symbol-report/scripts
          java -Djava.awt.headless=true -jar /tmp/ffdec/ffdec.jar -onerror ignore -export script /tmp/scripts /tmp/game.swf | tee skill-symbol-report/script-export.log
          find /tmp/scripts -type f | sort > skill-symbol-report/script-files.txt
          echo "SCRIPT_FILES=$(wc -l < skill-symbol-report/script-files.txt)"
          cp -a /tmp/scripts/. skill-symbol-report/scripts/

      - name: Build key mapping grep report
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/scripts')
          pats=[
            r'Key\.isDown',r'Key\.',r'keyCode',r'charCode',r'onKeyDown',r'onKeyUp',
            r'\b65\b',r'\b83\b',r'\b68\b',r'\b70\b',r'\b71\b',r'\b72\b',
            r'\b81\b',r'\b87\b',r'\b69\b',r'\b82\b',r'\b84\b',r'\b89\b',
            r'\b88\b',r'\b67\b',r'\b90\b',
            r'스킬',r'귀검',r'검사',r'技能',r'鬼剑',r'鬼劍',r'레바'
          ]
          rx=re.compile('|'.join('(?:'+p+')' for p in pats),re.I)
          out=[]
          for p in root.rglob('*'):
            if not p.is_file(): continue
            try: lines=p.read_text(errors='ignore').splitlines()
            except: continue
            for i,line in enumerate(lines):
              if rx.search(line):
                a=max(0,i-3); b=min(len(lines),i+4)
                out.append('\n### '+str(p.relative_to(root))+f':{i+1}\n'+'\n'.join(f'{j+1:05d}: {lines[j]}' for j in range(a,b)))
          Path('skill-symbol-report/key-mapping-hits.txt').write_text('\n'.join(out),errors='ignore')
          print('KEY_HIT_BLOCKS',len(out))
          PY

      - name: Export first frame of all sprites and buttons
        run: |
          set -euo pipefail
          mkdir -p /tmp/sprites /tmp/buttons
          java -Djava.awt.headless=true -jar /tmp/ffdec/ffdec.jar -onerror ignore -select 'all:1' -export sprite:png /tmp/sprites /tmp/game.swf | tee skill-symbol-report/sprite-export.log
          java -Djava.awt.headless=true -jar /tmp/ffdec/ffdec.jar -onerror ignore -export button:png /tmp/buttons /tmp/game.swf | tee skill-symbol-report/button-export.log
          find /tmp/sprites -type f | sort > skill-symbol-report/sprite-files.txt
          find /tmp/buttons -type f | sort > skill-symbol-report/button-files.txt
          echo "SPRITE_FILES=$(wc -l < skill-symbol-report/sprite-files.txt)"
          echo "BUTTON_FILES=$(wc -l < skill-symbol-report/button-files.txt)"

      - name: Build small-symbol candidate sheets
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p skill-symbol-report/symbol_candidates skill-symbol-report/sheets
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          import json,math,shutil
          roots=[('sprite',Path('/tmp/sprites')),('button',Path('/tmp/buttons'))]
          out=Path('skill-symbol-report')
          rows=[]
          for kind,root in roots:
            for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              try:
                with Image.open(p) as im:
                  w,h=im.size
                if 18<=w<=120 and 18<=h<=120 and 0.55<=w/max(h,1)<=1.75:
                  rows.append((kind,p,w,h,root))
              except: pass
          manifest=[]
          for i,(kind,p,w,h,root) in enumerate(rows,1):
            ext=p.suffix.lower() or '.png'
            dst=out/'symbol_candidates'/f'{i:05d}_{kind}_{w}x{h}_{p.stem}{ext}'
            shutil.copy2(p,dst)
            manifest.append({'id':i,'kind':kind,'w':w,'h':h,'source':str(p.relative_to(root)),'file':dst.name})
          (out/'symbol-manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False))
          print('SMALL_SYMBOL_CANDIDATES',len(manifest))
          cell=128; cols=8; per=64; font=ImageFont.load_default()
          for page,start in enumerate(range(0,len(manifest),per),1):
            part=manifest[start:start+per]; rr=math.ceil(len(part)/cols)
            sh=Image.new('RGB',(cols*cell,rr*cell),(28,28,28)); d=ImageDraw.Draw(sh)
            for j,x in enumerate(part):
              r=j//cols;c=j%cols;x0=c*cell;y0=r*cell
              p=out/'symbol_candidates'/x['file']
              try:
                im=Image.open(p).convert('RGBA'); im.thumbnail((88,88),Image.Resampling.LANCZOS)
                bg=Image.new('RGBA',(92,92),(235,235,235,255)); bg.alpha_composite(im,((92-im.width)//2,(92-im.height)//2))
                sh.paste(bg.convert('RGB'),(x0+18,y0+5))
              except: pass
              d.text((x0+4,y0+101),f"#{x['id']:05d} {x['kind'][0]} {x['w']}x{x['h']}",fill='white',font=font)
              d.text((x0+4,y0+114),Path(x['source']).name[:18],fill=(195,195,195),font=font)
            sh.save(out/'sheets'/f'symbols_{page:03d}.png')
          PY

      - name: Upload trace report
        uses: actions/upload-artifact@v4
        with:
          name: reva-3.0ex-skill-symbol-trace
          if-no-files-found: error
          path: skill-symbol-report/**
