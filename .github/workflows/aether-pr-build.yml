name: AETHER PR APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'aether-native/**'

permissions:
  contents: read

jobs:
  build-aether:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          BT="$ANDROID_HOME/build-tools/35.0.0"

          if [ ! -f "$ANDROID_JAR" ] || [ ! -x "$BT/aapt2" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 2>/dev/null | sort | tail -n 1 || true)"
            if [ -z "$SDKMANAGER" ]; then
              echo "Installed Android SDK packages:"
              find "$ANDROID_HOME/platforms" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort || true
              find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort || true
              exit 1
            fi
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi

          test -f "$ANDROID_JAR"
          test -x "$BT/aapt2"
          echo "Using $ANDROID_JAR"
          echo "Using $BT"

      - name: Build zero-dependency APK
        working-directory: aether-native
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf out
          mkdir -p out/classes out/dex
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          BT="$ANDROID_HOME/build-tools/35.0.0"

          javac -source 8 -target 8 -encoding UTF-8             -classpath "$ANDROID_JAR"             -d out/classes             src/com/aether/noema/MainActivity.java

          mapfile -t CLASS_FILES < <(find out/classes -name '*.class' -print)
          "$BT/d8"             --lib "$ANDROID_JAR"             --min-api 26             --output out/dex             "${CLASS_FILES[@]}"

          "$BT/aapt2" compile             --dir res             -o out/resources.zip

          "$BT/aapt2" link             -o out/AETHER-unsigned.apk             -I "$ANDROID_JAR"             --manifest AndroidManifest.xml             -R out/resources.zip             --auto-add-overlay             --min-sdk-version 26             --target-sdk-version 35             --version-code 2             --version-name 0.2.0

          zip -j out/AETHER-unsigned.apk out/dex/classes.dex
          "$BT/zipalign" -f -p 4 out/AETHER-unsigned.apk out/AETHER-aligned.apk

          base64 -d signing/aether-prototype.keystore.b64 > out/aether-prototype.keystore

          "$BT/apksigner" sign             --ks out/aether-prototype.keystore             --ks-key-alias aether             --ks-pass pass:aetherdev2026             --key-pass pass:aetherdev2026             --out out/AETHER-debug.apk             out/AETHER-aligned.apk

          "$BT/apksigner" verify --verbose out/AETHER-debug.apk
          "$BT/aapt2" dump badging out/AETHER-debug.apk | head -40

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-v0.2-debug
          path: aether-native/out/AETHER-debug.apk
          if-no-files-found: error
