name: Trace Proven 3.0 EX Skill Sprites

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/trace-proven-skill-sprites.yml'

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download pinned SWF and FFDec
        run: |
          set -euo pipefail
          mkdir -p report
          python3 - <<'PY'
          import urllib.request,hashlib
          u='https://www.mhhf.com/files/game/4711/lbmxex.swf'
          q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.mhhf.com/'})
          b=urllib.request.urlopen(q,timeout=120).read()
          assert len(b)==17628685
          assert hashlib.sha256(b).hexdigest()=='0c7904469438078919c705dc7d0da11a9e0595fce29decd68f84599b25d3f457'
          open('/tmp/game.swf','wb').write(b)
          PY
          curl -fL --retry 3 --retry-delay 2 -o /tmp/ffdec.zip 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip'
          echo '0333b56998a55bd83f4e0deb678a811fcdc45607582b4f5dd438309c8c3ad5ce  /tmp/ffdec.zip' | sha256sum -c -
          mkdir -p /tmp/ffdec && unzip -q /tmp/ffdec.zip -d /tmp/ffdec

      - name: Export ActionScript
        run: |
          set -euo pipefail
          mkdir -p /tmp/scripts
          java -Djava.awt.headless=true -jar /tmp/ffdec/ffdec.jar -onerror ignore -export script /tmp/scripts /tmp/game.swf 2>&1 | tee report/script-export.log

      - name: Prove class key handlers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('/tmp/scripts')
          keycodes=[
            (65,'A'),(83,'S'),(68,'D'),(70,'F'),(71,'G'),(72,'H'),
            (81,'Q'),(87,'W'),(69,'E'),(82,'R'),(84,'T'),(89,'Y'),
            (16,'SHIFT'),(66,'B'),(17,'CTRL'),(32,'SPACE')
          ]
          classes={
            'Spitfire':(4050,4111),
            'Ranger':(4120,4173),
            'Berserker':(4174,4228),
            'WeaponMaster':(4230,4289),
          }
          found={}
          for p in root.rglob('*.as'):
            rel=str(p.relative_to(root))
            # FFDec nests exports under /tmp/scripts/scripts/DefineSprite_xxx/...
            # so the sprite component can occur after an extra directory prefix.
            m=re.search(r'(?:^|/)DefineSprite_(\d+)(?:/|$)',rel)
            if not m:
              continue
            sid=int(m.group(1))
            cls=next((name for name,(lo,hi) in classes.items() if lo<=sid<=hi),None)
            if not cls:
              continue
            text=p.read_text(errors='ignore')
            for code,key in keycodes:
              if re.search(rf'Key\.isDown\({code}\)',text):
                k=(cls,key,code,sid)
                found.setdefault(k,[]).append(rel)

          rows=[]
          for (cls,key,code,sid),scripts in sorted(found.items(),key=lambda x:(list(classes).index(x[0][0]),x[0][1],x[0][3])):
            rows.append({'class':cls,'key':key,'keyCode':code,'spriteId':sid,'scripts':sorted(scripts)})

          out=Path('report')
          out.joinpath('handler-map.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          with out.joinpath('handler-map.tsv').open('w') as f:
            f.write('class\tkey\tkeyCode\tspriteId\tscriptCount\n')
            for r in rows:
              f.write(f"{r['class']}\t{r['key']}\t{r['keyCode']}\t{r['spriteId']}\t{len(r['scripts'])}\n")

          # Hard evidence from the original AS2. These 16 mappings must stay exact.
          expected={
            ('Spitfire','SHIFT'):4088,('Spitfire','B'):4092,('Spitfire','CTRL'):4103,('Spitfire','SPACE'):4110,
            ('Ranger','SHIFT'):4155,('Ranger','B'):4151,('Ranger','CTRL'):4165,('Ranger','SPACE'):4172,
            ('Berserker','SHIFT'):4213,('Berserker','B'):4209,('Berserker','CTRL'):4221,('Berserker','SPACE'):4227,
            ('WeaponMaster','SHIFT'):4272,('WeaponMaster','B'):4276,('WeaponMaster','CTRL'):4283,('WeaponMaster','SPACE'):4288,
          }
          actual={(r['class'],r['key']):r['spriteId'] for r in rows}
          for k,v in expected.items():
            if actual.get(k)!=v:
              raise SystemExit(f'EX handler mismatch {k}: expected {v}, got {actual.get(k)}')

          ids=sorted({r['spriteId'] for r in rows})
          out.joinpath('handler-sprite-ids.txt').write_text(','.join(map(str,ids))+'\n')
          out.joinpath('handler-frame-selection.txt').write_text(','.join(f'{x}:1' for x in ids)+'\n')
          out.joinpath('handler-summary.txt').write_text(f'HANDLER_ROWS={len(rows)}\nUNIQUE_HANDLER_SPRITES={len(ids)}\nEX_MAPPINGS_PROVEN={len(expected)}\n')
          print('HANDLER_ROWS',len(rows),'UNIQUE',len(ids),'EX_PROVEN',len(expected))
          if len(rows) < 50 or len(ids) < 45:
            raise SystemExit('Unexpectedly sparse handler map')
          PY

      - name: Export only proven handler sprites
        run: |
          set -euo pipefail
          mkdir -p /tmp/sprites report/sprites
          IDS="$(cat report/handler-sprite-ids.txt)"
          FRAMES="$(cat report/handler-frame-selection.txt)"
          set +e
          java -Djava.awt.headless=true -jar /tmp/ffdec/ffdec.jar \
            -onerror ignore \
            -selectid "$IDS" \
            -select "$FRAMES" \
            -format sprite:png \
            -export sprite /tmp/sprites /tmp/game.swf \
            2>&1 | tee report/sprite-export.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "SPRITE_EXPORT_EXIT=$rc" | tee report/sprite-export-status.txt
          find /tmp/sprites -type f | sort > report/sprite-files.txt
          count=$(wc -l < report/sprite-files.txt)
          echo "SPRITE_FILES=$count" | tee -a report/sprite-export-status.txt
          cp -a /tmp/sprites/. report/sprites/ || true
          test "$rc" -eq 0
          test "$count" -ge 40

      - name: Build handler sprite contact sheets
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p report/sheets
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          import math,json,re
          root=Path('report/sprites')
          imgs=[]
          for p in sorted(root.rglob('*.png')):
            try:
              with Image.open(p) as im: w,h=im.size
              m=re.search(r'DefineSprite_(\d+)',str(p))
              imgs.append((p,w,h,int(m.group(1)) if m else -1))
            except Exception: pass
          Path('report/sprite-dimensions.json').write_text(json.dumps([
            {'file':str(p.relative_to(root)),'w':w,'h':h,'spriteId':sid} for p,w,h,sid in imgs
          ],indent=2))
          cell=150; cols=6; per=36; font=ImageFont.load_default()
          for page,start in enumerate(range(0,len(imgs),per),1):
            part=imgs[start:start+per]; rows=math.ceil(len(part)/cols)
            sheet=Image.new('RGB',(cols*cell,rows*cell),(28,28,28)); d=ImageDraw.Draw(sheet)
            for j,(p,w,h,sid) in enumerate(part):
              r=j//cols; c=j%cols; x0=c*cell; y0=r*cell
              im=Image.open(p).convert('RGBA'); im.thumbnail((112,112),Image.Resampling.LANCZOS)
              bg=Image.new('RGBA',(116,116),(235,235,235,255)); bg.alpha_composite(im,((116-im.width)//2,(116-im.height)//2))
              sheet.paste(bg.convert('RGB'),(x0+17,y0+4))
              d.text((x0+5,y0+123),f'Sprite {sid}  {w}x{h}',fill='white',font=font)
            sheet.save(Path('report/sheets')/f'handler-sprites-{page:02d}.png')
          print('CONTACT_SHEET_IMAGES',len(imgs))
          PY

      - name: Validate trace
        run: |
          set -euo pipefail
          test -s report/handler-map.json
          test -s report/handler-sprite-ids.txt
          test -s report/sprite-files.txt
          test -s report/sprite-dimensions.json
          grep -q 'EX_MAPPINGS_PROVEN=16' report/handler-summary.txt
          grep -q 'SPRITE_EXPORT_EXIT=0' report/sprite-export-status.txt

      - name: Upload proven sprite trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reva-3.0ex-proven-handler-sprites
          if-no-files-found: warn
          path: report/**
