name: Build Reva Android v1.4 Input Rewrite APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-from-archive.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source bootstrap and transforms
        uses: actions/checkout@v4

      - name: Reassemble baseline and apply v1.2 + v1.3 + v1.4 transforms
        run: |
          set -euo pipefail
          cat archive/part00 archive/part01 archive/part02 archive/part03 archive/part04 archive/part05 archive/part06 archive/part07 archive/part08 > /tmp/reva.zip.b64
          test "$(wc -c < /tmp/reva.zip.b64)" -eq 86132
          base64 -d /tmp/reva.zip.b64 > /tmp/reva_v1_1.zip
          echo '6ea5b7f9cd0d5a83e925de9199a17d4d8a969dad471e054ca681a9456747a3d2  /tmp/reva_v1_1.zip' | sha256sum -c -
          rm -rf work && mkdir -p work
          unzip -q /tmp/reva_v1_1.zip -d work
          cd work/reva_android_wrapper_v1_1
          cat "$GITHUB_WORKSPACE"/v1.2/mainpatch.part* > /tmp/v12-main.patch
          patch -p0 --fuzz=0 < /tmp/v12-main.patch
          python3 "$GITHUB_WORKSPACE/v1.3/apply_v13.py" app/src/main/java/com/ajiu/reva/MainActivity.java
          python3 "$GITHUB_WORKSPACE/v1.4/apply_v14.py" app/src/main/java/com/ajiu/reva/MainActivity.java
          python3 "$GITHUB_WORKSPACE/v1.4/finalize_v14.py" app/src/main/java/com/ajiu/reva/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text().replace('versionCode 11','versionCode 14').replace("versionName '1.1'","versionName '1.4'")
          p.write_text(s)
          p=Path('app/src/main/assets/index.html')
          s=p.read_text().replace('优先使用 APK 内置 Ruffle；只有构建时未打包 Ruffle 才会尝试联网备用源。','Ruffle 与 Final 本体均随 APK 内置；正常启动完全离线，联网仅用于可选修复 / 更换本体。')
          s=s.replace('从左上角菜单选择“智能获取本体”或“导入 / 替换原版 SWF”。','从左上角菜单选择“修复 / 更换本体”，或手动导入 SWF / FINAL.exe / Final.zip。')
          s=s.replace('window.__REVA_PLAYER_READY__=true;','window.__REVA_PLAYER_READY__=true; console.log(\'REVA_GAME_READY\');')
          p.write_text(s)
          PY
          cp "$GITHUB_WORKSPACE/v1.3/qa_nav.html" app/src/main/assets/qa_nav.html
          cp "$GITHUB_WORKSPACE/v1.4/check_project.py" tools/check_project.py
          cp "$GITHUB_WORKSPACE/v1.4/emulator_smoke.sh" tools/emulator_smoke.sh
          chmod +x tools/check_project.py tools/emulator_smoke.sh
          cd ..
          mv reva_android_wrapper_v1_1 reva_android_wrapper_v1_4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bundle pinned Ruffle self-hosted
        working-directory: work/reva_android_wrapper_v1_4
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/ruffle /tmp/ruffle_pkg
          curl -fL --retry 3 --retry-delay 2 -o /tmp/ruffle.zip "https://github.com/ruffle-rs/ruffle/releases/download/nightly-2026-09-05/ruffle-nightly-2026_09_05-web-selfhosted.zip"
          unzip -q /tmp/ruffle.zip -d /tmp/ruffle_pkg
          cp -a /tmp/ruffle_pkg/. app/src/main/assets/ruffle/
          test -f app/src/main/assets/ruffle/ruffle.js
          find app/src/main/assets/ruffle -maxdepth 1 -name '*.wasm' -print -quit | grep .

      - name: Bundle Final SWF for offline play
        working-directory: work/reva_android_wrapper_v1_4
        run: |
          set -euo pipefail
          rm -f app/src/main/assets/game.swf app/src/main/assets/game.swf.part
          if ! python3 tools/fetch_original.py app/src/main/assets/game.swf; then
            python3 -m pip install --disable-pip-version-check -q gdown
            gdown 'https://drive.google.com/uc?id=1iNaM6v8hvgJJcHXxL2TcNf12eubqgRDJ' -O app/src/main/assets/game.swf
          fi
          python3 tools/verify_swf.py app/src/main/assets/game.swf | tee bundled-game.txt
          test "$(wc -c < app/src/main/assets/game.swf)" -ge 31457280

      - name: Run full local QA
        working-directory: work/reva_android_wrapper_v1_4
        run: bash qa/run_local_qa.sh

      - name: Build debug APK
        working-directory: work/reva_android_wrapper_v1_4
        run: gradle --no-daemon assembleDebug

      - name: Inspect APK contents and metadata
        working-directory: work/reva_android_wrapper_v1_4
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee app-debug.apk.sha256
          unzip -l "$APK" | tee apk-files.txt
          grep -E 'assets/game.swf|assets/ruffle/ruffle.js|assets/ruffle/.*\.wasm|assets/qa_nav.html' apk-files.txt
          awk '$4=="assets/game.swf" { if ($1 < 31457280) exit 1; found=1 } END { if (!found) exit 1 }' apk-files.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.ajiu.reva'" apk-badging.txt
          grep -q "versionName='1.4'" apk-badging.txt
          grep -q "targetSdkVersion:'35'" apk-badging.txt

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android 35 emulator regression test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            bash work/reva_android_wrapper_v1_4/tools/emulator_smoke.sh work/reva_android_wrapper_v1_4/app/build/outputs/apk/debug/app-debug.apk work/reva_android_wrapper_v1_4/qa/emulator

      - name: Upload APK and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reva-android-v1.4-input-rewrite
          if-no-files-found: warn
          path: |
            work/reva_android_wrapper_v1_4/app/build/outputs/apk/debug/app-debug.apk
            work/reva_android_wrapper_v1_4/app-debug.apk.sha256
            work/reva_android_wrapper_v1_4/apk-badging.txt
            work/reva_android_wrapper_v1_4/apk-files.txt
            work/reva_android_wrapper_v1_4/bundled-game.txt
            work/reva_android_wrapper_v1_4/qa/emulator/**
