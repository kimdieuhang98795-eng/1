name: Build Reva Android APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'archive/**'
      - '.github/workflows/build-from-archive.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout archive chunks
        uses: actions/checkout@v4

      - name: Reassemble and verify v1.1 source archive
        run: |
          set -euo pipefail
          test "$(wc -c < archive/part00)" -eq 10000
          test "$(wc -c < archive/part01)" -eq 10000
          test "$(wc -c < archive/part02)" -eq 10000
          test "$(wc -c < archive/part03)" -eq 10000
          test "$(wc -c < archive/part04)" -eq 10000
          test "$(wc -c < archive/part05)" -eq 10000
          test "$(wc -c < archive/part06)" -eq 10000
          test "$(wc -c < archive/part07)" -eq 10000
          test "$(wc -c < archive/part08)" -eq 6132
          cat archive/part00 archive/part01 archive/part02 archive/part03 archive/part04 archive/part05 archive/part06 archive/part07 archive/part08 > /tmp/reva.zip.b64
          test "$(wc -c < /tmp/reva.zip.b64)" -eq 86132
          base64 -d /tmp/reva.zip.b64 > /tmp/reva_v1_1.zip
          echo '6ea5b7f9cd0d5a83e925de9199a17d4d8a969dad471e054ca681a9456747a3d2  /tmp/reva_v1_1.zip' | sha256sum -c -
          unzip -t /tmp/reva_v1_1.zip
          rm -rf "$GITHUB_WORKSPACE/work"
          mkdir -p "$GITHUB_WORKSPACE/work"
          unzip -q /tmp/reva_v1_1.zip -d "$GITHUB_WORKSPACE/work"
          test -f "$GITHUB_WORKSPACE/work/reva_android_wrapper_v1_1/app/build.gradle"
          test -f "$GITHUB_WORKSPACE/work/reva_android_wrapper_v1_1/app/src/main/java/com/ajiu/reva/MainActivity.java"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bundle pinned Ruffle self-hosted
        working-directory: work/reva_android_wrapper_v1_1
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/ruffle /tmp/ruffle_pkg
          curl -fL --retry 3 --retry-delay 2 -o /tmp/ruffle.zip "https://github.com/ruffle-rs/ruffle/releases/download/nightly-2026-09-05/ruffle-nightly-2026_09_05-web-selfhosted.zip"
          unzip -q /tmp/ruffle.zip -d /tmp/ruffle_pkg
          cp -a /tmp/ruffle_pkg/. app/src/main/assets/ruffle/
          test -f app/src/main/assets/ruffle/ruffle.js
          find app/src/main/assets/ruffle -maxdepth 1 -name '*.wasm' -print -quit | grep .

      - name: Run local core QA
        working-directory: work/reva_android_wrapper_v1_1
        run: bash qa/run_local_qa.sh

      - name: Build debug APK
        working-directory: work/reva_android_wrapper_v1_1
        run: gradle --no-daemon assembleDebug

      - name: Inspect APK
        working-directory: work/reva_android_wrapper_v1_1
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee app-debug.apk.sha256
          unzip -l "$APK" | grep -E 'assets/ruffle/ruffle.js|assets/ruffle/.*\.wasm'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.ajiu.reva'" apk-badging.txt
          grep -q "targetSdkVersion:'35'" apk-badging.txt

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android 35 emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: cd work/reva_android_wrapper_v1_1 && bash tools/emulator_smoke.sh app/build/outputs/apk/debug/app-debug.apk qa/emulator

      - name: Upload APK and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reva-android-debug
          if-no-files-found: warn
          path: |
            work/reva_android_wrapper_v1_1/app/build/outputs/apk/debug/app-debug.apk
            work/reva_android_wrapper_v1_1/app-debug.apk.sha256
            work/reva_android_wrapper_v1_1/apk-badging.txt
            work/reva_android_wrapper_v1_1/qa/emulator/**
